name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
# python-publish.yml supplies the persisted version and immutable source commit.
# Notes are generated from the prior release in dry-run mode; merges do not update drafts.

change-template: "- #$NUMBER - $TITLE (@$AUTHOR)"
categories:
  - title: "⚠ Breaking Changes"
    labels:
      - "breaking-change"
  - title: "⬆️ Dependencies"
    collapse-after: 1
    labels:
      - "dependencies"
template: |
  ## What’s Changed

  $CHANGES
