name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
# python-build.yml supplies the UTC CalVer version and immutable source commit.

change-template: "- #$NUMBER - $TITLE (@$AUTHOR)"
categories:
  - title: "⚠ Breaking Changes"
    labels:
      - "breaking-change"
  - title: "⬆️ Dependencies"
    collapse-after: 1
    labels:
      - "dependencies"
template: |
  ## What’s Changed

  $CHANGES
