name: Sync canboat release

# Opens a pull request moving nmea2000 to canboat's latest release: the
# release's canboat.json and the same version of the `canboat` crate in
# rust/Cargo.toml (and Cargo.lock), then rebuilds the Python extension and
# regenerates the native-unit table before opening the pull request. Every
# schema version change needs regeneration, even if no units changed.
#
# Pull requests opened with the default GITHUB_TOKEN do not start other
# workflows, so set the CANBOAT_SYNC_TOKEN secret (a fine-grained token with
# contents and pull-requests write access) for the checks to run on it.

on:
  schedule:
    - cron: '0 3 * * 1'  # Runs at 03:00 UTC every Monday
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # Don't use default GitHub credentials

      - name: Find canboat's latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo canboat/canboat --json tagName --jq .tagName)
          latest=${tag#v}
          current=$(sed -nE 's/^canboat = \{ version = "([^"]+)".*/\1/p' rust/Cargo.toml)
          if [ -z "$current" ]; then
            echo "::error::no canboat version found in rust/Cargo.toml"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "Already on canboat $current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "canboat $current -> $latest"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update canboat.json and the crate
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release download "$TAG" --repo canboat/canboat --pattern canboat.json --clobber
          sed -i -E "s/^(canboat = \{ version = \")[^\"]+/\1$VERSION/" rust/Cargo.toml

      - name: Set up Rust
        if: steps.release.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Update Cargo.lock
        if: steps.release.outputs.changed == 'true'
        working-directory: rust
        run: cargo update --package canboat

      - name: Set up Python
        if: steps.release.outputs.changed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install updated package
        if: steps.release.outputs.changed == 'true'
        run: python -m pip install -e ".[dev]"

      - name: Regenerate Python code
        if: steps.release.outputs.changed == 'true'
        run: |
          python canboat2python.py
          python check_generated_files.py

      - name: Create Pull Request
        if: steps.release.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CANBOAT_SYNC_TOKEN || github.token }}
          branch: update-canboat
          delete-branch: true
          title: "Update canboat to ${{ steps.release.outputs.tag }}"
          body: >-
            Moves `canboat.json` and the `canboat` crate to canboat's
            [${{ steps.release.outputs.tag }}](https://github.com/canboat/canboat/releases/tag/${{ steps.release.outputs.tag }})
            release and regenerates the Python native-unit table.
          commit-message: "Update canboat to ${{ steps.release.outputs.tag }}"
          base: main
          labels: "automation"
