# Uploads the Python package to PyPI when a release is published.
#
# nmea2000 contains a compiled core (rust/, built with maturin), so a release
# is a set of wheels, one per platform, plus a source distribution. The core
# targets the stable CPython ABI (abi3, 3.11+), so each wheel serves every
# supported Python version and the matrix is platforms only.
#
# Raspberry Pi coverage:
#   Pi 3, 4, 5, Zero 2 W on 64-bit Raspberry Pi OS  manylinux aarch64
#   Pi 2, 3, 4, 5, Zero 2 W on 32-bit Raspberry Pi OS  manylinux armv7
# The ARMv6 Pi Zero, Zero W and 1 have no wheel and build from the sdist.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel (${{ matrix.platform }} ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: manylinux, runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { platform: manylinux, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          # 32-bit Raspberry Pi OS
          - { platform: manylinux, runner: ubuntu-latest, target: armv7, manylinux: auto }
          - { platform: musllinux, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { platform: musllinux, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { platform: macos, runner: macos-latest, target: aarch64 }
          - { platform: macos, runner: macos-latest, target: x86_64 }
          - { platform: windows, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Apply release version to package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install --upgrade packaging
          python .github/scripts/set_release_version.py

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: --release --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform }}-${{ matrix.target }}
          path: dist/

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Apply release version to package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install --upgrade packaging
          python .github/scripts/set_release_version.py

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/

  verify:
    name: Verify (${{ matrix.runner }}, Python ${{ matrix.python }})
    needs: [wheels, sdist]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Check, install and test this platform's wheel
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install --upgrade pip twine pytest pytest-asyncio
          python -m twine check dist/*
          python -m pip install --only-binary :all: --find-links dist nmea2000
          # Outside the source tree, so the installed wheel is what runs.
          cp -r tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import os
          from importlib.metadata import version

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          actual = version("nmea2000")
          if actual != expected:
              raise SystemExit(f"Built package version is {actual!r}; expected {expected!r}")
          PY
          python -m pytest -o asyncio_mode=auto tests

  # The armv7 wheel (32-bit Raspberry Pi OS) on an emulated Pi 2 CPU; the
  # other wheels are tested natively by the verify job.
  verify-raspberry-pi:
    name: Verify (Raspberry Pi, 32-bit)
    needs: [wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Install and test the wheel on an emulated Cortex-A7
        run: |
          mkdir pi
          cp dist/*_armv7l.whl pi/
          cp -r tests pi/tests
          docker run --rm --platform linux/arm/v7 -e QEMU_CPU=cortex-a7 \
            -v "$PWD/pi:/pi" -w /pi python:3.11-slim-bookworm sh -ec '
              python3 -m pip install --disable-pip-version-check \
                --extra-index-url https://www.piwheels.org/simple \
                --only-binary :all: ./*.whl pytest pytest-asyncio
              python3 -m pytest -o asyncio_mode=auto tests
            '

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - verify
      - verify-raspberry-pi
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      url: https://pypi.org/project/nmea2000/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
