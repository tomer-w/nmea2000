# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Apply release version to package
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install --upgrade packaging
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          from packaging.version import InvalidVersion, Version

          release_tag = os.environ["RELEASE_TAG"]
          release_version = release_tag.removeprefix("v")
          try:
              Version(release_version)
          except InvalidVersion as error:
              raise SystemExit(f"Release tag {release_tag!r} is not a valid package version") from error

          pyproject_path = Path("pyproject.toml")
          pyproject = pyproject_path.read_text(encoding="utf-8")
          project_start = pyproject.index("[project]")
          next_section = pyproject.find("\n[", project_start + len("[project]"))
          project_end = len(pyproject) if next_section == -1 else next_section
          project = pyproject[project_start:project_end]
          project, replacements = re.subn(
              r'(?m)^version\s*=\s*"[^"]+"\s*$',
              f'version = "{release_version}"',
              project,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Expected exactly one version in the [project] table")

          pyproject_path.write_text(
              pyproject[:project_start] + project + pyproject[project_end:],
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"value={release_version}", file=output)
          PY

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Verify release distributions
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python -m pip install twine
          python -m twine check dist/*
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          python - <<'PY'
          import os
          from importlib.metadata import version

          expected = os.environ["RELEASE_VERSION"]
          actual = version("nmea2000")
          if actual != expected:
              raise SystemExit(f"Built package version is {actual!r}; expected {expected!r}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      # OPTIONAL: uncomment and update to include your PyPI project URL in the deployment status:
      url: https://pypi.org/project/nmea2000/
      #
      # ALTERNATIVE: if your GitHub Release name is the PyPI project version string
      # ALTERNATIVE: exactly, uncomment the following line instead:
      # url: https://pypi.org/project/YOURPROJECT/${{ github.event.release.name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
