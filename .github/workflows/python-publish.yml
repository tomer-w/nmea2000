# Prepares, verifies and publishes a release in one manually initiated run.
#
# nmea2000 contains a compiled core (rust/, built with maturin), so a release
# is a set of wheels, one per platform, plus a source distribution. The core
# targets the stable CPython ABI (abi3, 3.11+), so each wheel serves every
# supported Python version and the matrix is platforms only.
#
# Raspberry Pi coverage:
#   Pi 3, 4, 5, Zero 2 W on 64-bit Raspberry Pi OS  manylinux aarch64
#   Pi 2, 3, 4, 5, Zero 2 W on 32-bit Raspberry Pi OS  manylinux armv7
# The ARMv6 Pi Zero, Zero W and 1 have no wheel and build from the sdist.

name: Release Python Package

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional YYYY.M.PATCH for a manual month/year change (e.g. 2026.11.0)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: calver-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Persist release version
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.value }}
      sha: ${{ steps.source.outputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: echo "Releases must be dispatched from main" >&2; exit 1
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Select release version
        id: version
        env:
          TESTED_REF: ${{ github.sha }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          python -m pip install --upgrade packaging
          python .github/scripts/set_release_version.py --prepare "$TESTED_REF" --version "$REQUESTED_VERSION"
      - name: Persist package version
        id: source
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- pyproject.toml; then
            git add pyproject.toml
            git commit -m "Prepare release v$VERSION"
          fi
          # A concurrent push must fail even when this version was already persisted.
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ci:
    needs: [prepare]
    uses: ./.github/workflows/python-build.yml
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}

  wheels:
    needs: [prepare]
    name: Wheel (${{ matrix.platform }} ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: manylinux, runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { platform: manylinux, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          # 32-bit Raspberry Pi OS
          - { platform: manylinux, runner: ubuntu-latest, target: armv7, manylinux: auto }
          - { platform: musllinux, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { platform: musllinux, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { platform: macos, runner: macos-latest, target: aarch64 }
          - { platform: macos, runner: macos-latest, target: x86_64 }
          - { platform: windows, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: --release --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-wheel-${{ matrix.platform }}-${{ matrix.target }}
          path: dist/

  sdist:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-sdist
          path: dist/

  verify:
    name: Verify (${{ matrix.runner }}, Python ${{ matrix.python }})
    needs: [prepare, wheels, sdist]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: release-*
          merge-multiple: true

      - name: Check, install and test this platform's wheel
        shell: bash
        env:
          RELEASE_TAG: v${{ needs.prepare.outputs.version }}
        run: |
          python -m pip install --upgrade pip twine pytest pytest-asyncio
          python -m twine check dist/*
          python .github/scripts/verify_distributions.py
          python -m pip install --no-index --no-deps --only-binary :all: --find-links dist "nmea2000==${RELEASE_TAG#v}"
          python -m pip install "nmea2000==${RELEASE_TAG#v}"
          # Outside the source tree, so the installed wheel is what runs.
          cp -r tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import os
          from importlib.metadata import version

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          actual = version("nmea2000")
          if actual != expected:
              raise SystemExit(f"Built package version is {actual!r}; expected {expected!r}")
          PY
          python -m pytest -o asyncio_mode=auto tests

  # The armv7 wheel (32-bit Raspberry Pi OS) on an emulated Pi 2 CPU; the
  # other wheels are tested natively by the verify job.
  verify-raspberry-pi:
    name: Verify (Raspberry Pi, 32-bit)
    needs: [prepare, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: release-wheel-*
          merge-multiple: true

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Install and test the wheel on an emulated Cortex-A7
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir pi
          cp dist/*_armv7l.whl pi/
          cp -r tests pi/tests
          docker run --rm --platform linux/arm/v7 -e QEMU_CPU=cortex-a7 -e RELEASE_VERSION \
            -v "$PWD/pi:/pi" -w /pi python:3.11-slim-bookworm sh -ec '
              python3 -m pip install --disable-pip-version-check \
                --extra-index-url https://www.piwheels.org/simple \
                --only-binary :all: ./*.whl pytest pytest-asyncio
              python3 -c "import os; from importlib.metadata import version; assert version(\"nmea2000\") == os.environ[\"RELEASE_VERSION\"]"
              python3 -m pytest -o asyncio_mode=auto tests
            '

  github-release:
    name: Create matching tag and release
    needs: [prepare, ci, verify, verify-raspberry-pi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Generate release notes without modifying drafts
        id: notes
        uses: release-drafter/release-drafter@v7
        with:
          dry-run: true
          version: ${{ needs.prepare.outputs.version }}
          tag: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          commitish: ${{ needs.prepare.outputs.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release without moving existing tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_NOTES: ${{ steps.notes.outputs.body }}
        run: |
          python -m pip install --upgrade packaging
          python .github/scripts/create_release.py

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - verify
      - verify-raspberry-pi
      - github-release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      url: https://pypi.org/project/nmea2000/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: release-*
          merge-multiple: true

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
