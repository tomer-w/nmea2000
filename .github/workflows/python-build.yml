name: Python package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check generated files
        run: python check_generated_files.py
      - name: Lint with Ruff
        run: ruff check . --line-length 127
      - name: Lint with Pylint
        run: pylint nmea2000 tests canboat2python.py check_generated_files.py import_tests.py --reports=no
      - name: Type-check with Pyright
        run: npx --yes pyright
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 README.md

  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test with pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest
          -p pytest_asyncio.plugin
          -p pytest_cov.plugin
          --cov=nmea2000
          --cov-report=xml
          --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build frontend
        run: python -m pip install --upgrade pip && python -m pip install build
      - name: Build distributions
        run: python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: package-distributions
          path: dist/

  update_release_draft:
    if: github.event_name == 'push'
    permissions:
      # write permission is required to create a github release
      contents: write
    needs:
      - package
      - quality
      - test
    runs-on: ubuntu-latest
    steps:
      # Drafts your next Release notes as Pull Requests are merged into "main"
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
