[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nmea2000"
version = "2026.8.1"
description = "NMEA 2000 encoder and decoder"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Tomer-w" },
]
requires-python = ">=3.11"
dependencies = [
    "orjson>=3.10,<4.0",
    "pyserial-asyncio>=0.6",
    "tenacity>=9.0.0",
    "python-can>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "build",
    "pylint",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff==0.16.5",
    "pre-commit",
    "jinja2",
]

[project.urls]
Homepage = "https://github.com/tomer-w/nmea2000"
Repository = "https://github.com/tomer-w/nmea2000"
Issues = "https://github.com/tomer-w/nmea2000/issues"

[project.scripts]
nmea2000-cli = "nmea2000.cli:main"

[tool.setuptools.packages.find]
include = ["nmea2000*"]

[tool.ruff]
extend-exclude = [ "nmea2000/pgns.py", "nmea2000/consts.py" ]
force-exclude = true

[tool.ruff.lint]
# NMEA 2000 timestamps are UTC-naive; numeric APIs explicitly document int inputs.
ignore = ["DTZ001", "DTZ005", "DTZ006", "DTZ007", "PYI041", "TRY004"]

[tool.ruff.lint.per-file-ignores]
"nmea2000/cli.py" = ["BLE001"]
"nmea2000/device.py" = ["BLE001"]
"nmea2000/ioclient.py" = ["BLE001", "TRY002"]
"tests/NMEA2000TestServer.py" = ["BLE001", "N999", "S110", "TRY002", "UP035"]

[tool.pyright]
typeCheckingMode = "basic"
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".venv",
    ".venv-*",
    "build",
]

[tool.pylint.main]
ignore-paths = [
    ".*[\\\\/]nmea2000[\\\\/]consts\\.py$",
    ".*[\\\\/]nmea2000[\\\\/]pgns\\.py$",
]

[tool.pylint.messages_control]
# Protocol codecs and their fixtures naturally exceed Pylint's generic size
# heuristics. Public API documentation is maintained in README.md.
disable = [
    # The encoder factory lazily imports its concrete registry to break the
    # runtime cycle between encoder.py and encoder_formats.py.
    "cyclic-import",
    "duplicate-code",
    "line-too-long",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-return-statements",
    "too-many-statements",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
